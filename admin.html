<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>後台管理 | 廖和風</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
 
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-init.js"></script>
 
<style>
    :root {
        --bg-base: #1a1c20;
        --bg-card: #24262a;
        --accent-color: #e67e22;
        --text-main: #f0f0f0;
        --text-sub: #a0a0a0;
        --border-tech: 1px solid rgba(230, 126, 34, 0.3);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Rajdhani', sans-serif; background: var(--bg-base); color: var(--text-main); font-size: 16px; }
    h1, h2, h3 { font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }
    a { color: var(--accent-color); }
 
    #login-view { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-box { background: var(--bg-card); border: var(--border-tech); border-radius: 12px; padding: 40px; width: 320px; }
    .login-box h1 { font-size: 1.4rem; margin-bottom: 20px; text-align: center; }
 
    input, select, textarea {
        width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 6px;
        border: 1px solid rgba(255,255,255,0.15); background: #17181b; color: var(--text-main); font-family: inherit; font-size: 1rem;
    }
    label { display: block; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 4px; }
 
    button { cursor: pointer; border: none; border-radius: 6px; padding: 10px 18px; font-family: 'Orbitron', sans-serif; font-size: 0.85rem; background: var(--accent-color); color: #fff; transition: 0.2s; }
    button:hover { opacity: 0.85; }
    button.secondary { background: transparent; border: 1px solid var(--text-sub); color: var(--text-main); }
    button.danger { background: #b23a2f; }
 
    #error-msg { color: #ff6b6b; font-size: 0.9rem; margin-bottom: 10px; min-height: 1.2em; }
 
    #dashboard { display: none; max-width: 1000px; margin: 0 auto; padding: 30px 20px 100px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 10px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
    .tab-btn { background: transparent; border: 1px solid var(--text-sub); color: var(--text-sub); }
    .tab-btn.active { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }
 
    .panel { display: none; }
    .panel.active { display: block; }
 
    .card { background: var(--bg-card); border: var(--border-tech); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
    .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); gap: 10px; }
    .item-row:last-child { border-bottom: none; }
    .item-row .info { flex: 1; }
    .item-row .info .t { font-weight: 700; }
    .item-row .info .s { font-size: 0.85rem; color: var(--text-sub); }
    .item-actions { display: flex; gap: 8px; }
 
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
    .form-grid .full { grid-column: 1 / -1; }
    @media (max-width: 700px) { .form-grid { grid-template-columns: 1fr; } }
 
    .thumbs { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .thumbs img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); }
 
    #migrate-box { margin-top: 40px; padding: 16px; border: 1px dashed var(--text-sub); border-radius: 10px; font-size: 0.85rem; color: var(--text-sub); }
    #save-status { font-size: 0.85rem; color: var(--text-sub); margin-top: 8px; min-height: 1.2em; }
</style>
</head>
<body>
 
<div id="login-view">
    <div class="login-box">
        <h1>後台登入</h1>
        <div id="error-msg"></div>
        <label>Email</label>
        <input type="email" id="login-email">
        <label>密碼</label>
        <input type="password" id="login-password">
        <button style="width:100%" onclick="doLogin()">登入</button>
    </div>
</div>
 
<div id="dashboard">
    <div class="topbar">
        <h1 style="margin:0;font-size:1.3rem;">網站後台管理</h1>
        <div>
            <a href="index.html" target="_blank" style="margin-right:16px;font-size:0.9rem;">查看網站 →</a>
            <button class="secondary" onclick="doLogout()">登出</button>
        </div>
    </div>
 
    <div class="tabs">
        <button class="tab-btn active" data-tab="experience" onclick="switchTab('experience')">經歷</button>
        <button class="tab-btn" data-tab="portfolio" onclick="switchTab('portfolio')">作品集</button>
        <button class="tab-btn" data-tab="certs" onclick="switchTab('certs')">證照</button>
    </div>
 
    <!-- 經歷 -->
    <div class="panel active" id="panel-experience">
        <div class="card"><div id="list-experience"></div></div>
        <div class="card">
            <h3 id="exp-form-title">新增經歷</h3>
            <input type="hidden" id="exp-id">
            <div class="form-grid">
                <div><label>日期 (例如 2026/01 或 2025)</label><input id="exp-date" placeholder="2026/01"></div>
                <div><label>排序 (數字越小越前面)</label><input type="number" id="exp-order" value="0"></div>
                <div><label>標題(中)</label><input id="exp-title-zh"></div>
                <div><label>標題(英，可留空)</label><input id="exp-title-en"></div>
                <div><label>內容說明(中，可留空)</label><input id="exp-content-zh"></div>
                <div><label>內容說明(英，可留空)</label><input id="exp-content-en"></div>
                <div><label>相關連結網址(可留空)</label><input id="exp-link" placeholder="https://..."></div>
                <div><label>連結顯示文字(可留空，預設「查看詳細」)</label><input id="exp-link-label"></div>
            </div>
            <button onclick="saveExperience()">儲存</button>
            <button class="secondary" onclick="resetExpForm()">清空表單</button>
            <div id="exp-status" style="font-size:0.85rem;color:var(--text-sub);margin-top:8px;"></div>
        </div>
    </div>
 
    <!-- 作品集 -->
    <div class="panel" id="panel-portfolio">
        <div class="card"><div id="list-portfolio"></div></div>
        <div class="card">
            <h3 id="pf-form-title">新增作品</h3>
            <input type="hidden" id="pf-id">
            <div class="form-grid">
                <div><label>作品標題(中)</label><input id="pf-title-zh"></div>
                <div><label>標題(英，可留空)</label><input id="pf-title-en"></div>
                <div><label>類型</label><select id="pf-type" onchange="togglePfType()"><option value="image">圖片</option><option value="pdf">PDF</option></select></div>
                <div><label>排序 (數字越小越前面)</label><input type="number" id="pf-order" value="0"></div>
                <div id="pf-image-field"><label>圖片網址(逗號分隔多張)</label><input id="pf-images" placeholder="url1.jpg, url2.jpg"></div>
                <div id="pf-pdf-field" style="display:none;"><label>PDF 網址</label><input id="pf-pdf" placeholder="https://..."></div>
                <div><label>標籤(可留空，例如「建築設計作品」)</label><input id="pf-tag-zh"></div>
                <div><label>備註小字(可留空)</label><input id="pf-note-zh"></div>
                <div class="full"><label>作品說明(可留空)</label><textarea id="pf-description-zh" rows="5" placeholder="在這裡輸入這項作品的作品說明、設計理念、概念等文字..."></textarea></div>
                <div><label>外部連結網址(可留空，例如作品網站)</label><input id="pf-link" placeholder="https://..."></div>
                <div><label>連結顯示文字(可留空)</label><input id="pf-link-label"></div>
            </div>
            <button onclick="savePortfolio()">儲存</button>
            <button class="secondary" onclick="resetPfForm()">清空表單</button>
            <div id="pf-status" style="font-size:0.85rem;color:var(--text-sub);margin-top:8px;"></div>
        </div>
    </div>
 
    <!-- 證照 -->
    <div class="panel" id="panel-certs">
        <div class="card"><div id="list-certs"></div></div>
        <div class="card">
            <h3 id="cert-form-title">新增證照</h3>
            <input type="hidden" id="cert-id">
            <div class="form-grid">
                <div><label>證照標題(中)</label><input id="cert-title-zh"></div>
                <div><label>標題(英，可留空)</label><input id="cert-title-en"></div>
                <div><label>排序 (數字越小越前面)</label><input type="number" id="cert-order" value="0"></div>
                <div class="full"><label>證照圖片網址(逗號分隔多張)</label><input id="cert-images" placeholder="cert1.jpg, cert2.jpg"></div>
                <div><label>標籤(中)</label><input id="cert-tag-zh"></div>
            </div>
            <button onclick="saveCert()">儲存</button>
            <button class="secondary" onclick="resetCertForm()">清空表單</button>
            <div id="cert-status" style="font-size:0.85rem;color:var(--text-sub);margin-top:8px;"></div>
        </div>
    </div>
 
    <div id="migrate-box">
        <p>一次性匯入舊資料按鈕</p>
        <button onclick="migrateOldData()">匯入預設資料</button>
        <div id="migrate-status"></div>
    </div>
</div>
 
<script>
    let currentUser = null;
 
    // ---------- 認證與儀表板 ----------
    firebase.auth().onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadAllLists();
        } else {
            document.getElementById('login-view').style.display = 'flex';
            document.getElementById('dashboard').style.display = 'none';
        }
    });
 
    function doLogin() {
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        if (!email || !password) {
            document.getElementById('error-msg').textContent = '請填寫帳號密碼';
            return;
        }
        document.getElementById('error-msg').textContent = '';
        firebase.auth().signInWithEmailAndPassword(email, password)
            .catch(err => document.getElementById('error-msg').textContent = err.message);
    }
 
    function doLogout() {
        firebase.auth().signOut();
    }
 
    // ---------- 標籤頁面切換 ----------
    function switchTab(tab) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('panel-' + tab).classList.add('active');
        document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
    }
 
    // ---------- 列表載入 ----------
    function loadList(col) {
        if (col === 'experience') {
            db.collection('experience').orderBy('order').get().then(snap => {
                const html = snap.docs.map(doc => {
                    const d = doc.data();
                    return `
                        <div class="item-row">
                            <div class="info">
                                <div class="t">${d.title_zh}</div>
                                <div class="s">${d.date} | 排序: ${d.order}</div>
                            </div>
                            <div class="item-actions">
                                <button onclick="editExperience('${doc.id}')">編輯</button>
                                <button class="danger" onclick="deleteItem('experience', '${doc.id}')">刪除</button>
                            </div>
                        </div>
                    `;
                }).join("");
                document.getElementById('list-experience').innerHTML = html || '<p style="color: var(--text-sub);">暫無資料</p>';
            });
        } else if (col === 'portfolio') {
            db.collection('portfolio').orderBy('order').get().then(snap => {
                const html = snap.docs.map(doc => {
                    const d = doc.data();
                    const imgs = d.images && d.images.length ? `<div class="thumbs">${d.images.slice(0,3).map(src => `<img src="${src}">`).join("")}</div>` : "";
                    return `
                        <div class="item-row">
                            <div class="info">
                                <div class="t">${d.title_zh}</div>
                                <div class="s">排序: ${d.order}</div>
                                ${imgs}
                            </div>
                            <div class="item-actions">
                                <button onclick="editPortfolio('${doc.id}')">編輯</button>
                                <button class="danger" onclick="deleteItem('portfolio', '${doc.id}')">刪除</button>
                            </div>
                        </div>
                    `;
                }).join("");
                document.getElementById('list-portfolio').innerHTML = html || '<p style="color: var(--text-sub);">暫無資料</p>';
            });
        } else if (col === 'certs') {
            db.collection('certs').orderBy('order').get().then(snap => {
                const html = snap.docs.map(doc => {
                    const d = doc.data();
                    const imgs = d.images && d.images.length ? `<div class="thumbs">${d.images.slice(0,3).map(src => `<img src="${src}">`).join("")}</div>` : (d.image ? `<div class="thumbs"><img src="${d.image}"></div>` : "");
                    return `
                        <div class="item-row">
                            <div class="info">
                                <div class="t">${d.title_zh}</div>
                                <div class="s">排序: ${d.order}</div>
                                ${imgs}
                            </div>
                            <div class="item-actions">
                                <button onclick="editCert('${doc.id}')">編輯</button>
                                <button class="danger" onclick="deleteItem('certs', '${doc.id}')">刪除</button>
                            </div>
                        </div>
                    `;
                }).join("");
                document.getElementById('list-certs').innerHTML = html || '<p style="color: var(--text-sub);">暫無資料</p>';
            });
        }
    }
 
    function loadAllLists() {
        loadList('experience');
        loadList('portfolio');
        loadList('certs');
    }
 
    function deleteItem(col, id) {
        if (!confirm('確定要刪除嗎？')) return;
        db.collection(col).doc(id).delete().then(() => {
            loadList(col);
        }).catch(err => alert('刪除失敗：' + err.message));
    }
 
    // ---------- 經歷 ----------
    function editExperience(id) {
        db.collection('experience').doc(id).get().then(doc => {
            const d = doc.data();
            document.getElementById('exp-id').value = id;
            document.getElementById('exp-form-title').textContent = '編輯經歷';
            document.getElementById('exp-date').value = d.date || '';
            document.getElementById('exp-order').value = d.order || 0;
            document.getElementById('exp-title-zh').value = d.title_zh || '';
            document.getElementById('exp-title-en').value = d.title_en || '';
            document.getElementById('exp-content-zh').value = d.content_zh || '';
            document.getElementById('exp-content-en').value = d.content_en || '';
            document.getElementById('exp-link').value = d.link || '';
            document.getElementById('exp-link-label').value = d.link_label_zh || '';
            switchTab('experience');
        });
    }
 
    function resetExpForm() {
        document.getElementById('exp-id').value = '';
        document.getElementById('exp-form-title').textContent = '新增經歷';
        ['exp-date','exp-title-zh','exp-title-en','exp-content-zh','exp-content-en','exp-link','exp-link-label'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('exp-order').value = 0;
        document.getElementById('exp-status').textContent = '';
    }
 
    function saveExperience() {
        const id = document.getElementById('exp-id').value;
        const date = document.getElementById('exp-date').value.trim();
        const titleZh = document.getElementById('exp-title-zh').value.trim();
        if (!date || !titleZh) { document.getElementById('exp-status').textContent = '請至少填寫日期和標題(中)'; return; }
        const data = {
            order: Number(document.getElementById('exp-order').value) || 0,
            date: date,
            title_zh: titleZh,
            title_en: document.getElementById('exp-title-en').value.trim(),
            content_zh: document.getElementById('exp-content-zh').value.trim(),
            content_en: document.getElementById('exp-content-en').value.trim(),
            link: document.getElementById('exp-link').value.trim(),
            link_label_zh: document.getElementById('exp-link-label').value.trim()
        };
        document.getElementById('exp-status').textContent = '儲存中...';
        const ref = id ? db.collection('experience').doc(id) : db.collection('experience').doc();
        ref.set(data).then(() => {
            document.getElementById('exp-status').textContent = '已儲存！';
            resetExpForm();
            loadList('experience');
        }).catch(err => document.getElementById('exp-status').textContent = '失敗：' + err.message);
    }
 
    // ---------- 作品集 ----------
    function editPortfolio(id) {
        db.collection('portfolio').doc(id).get().then(doc => {
            const d = doc.data();
            document.getElementById('pf-id').value = id;
            document.getElementById('pf-form-title').textContent = '編輯作品';
            document.getElementById('pf-title-zh').value = d.title_zh || '';
            document.getElementById('pf-title-en').value = d.title_en || '';
            document.getElementById('pf-type').value = d.pdf ? 'pdf' : 'image';
            togglePfType();
            document.getElementById('pf-images').value = (d.images || []).join(', ');
            document.getElementById('pf-pdf').value = d.pdf || '';
            document.getElementById('pf-tag-zh').value = d.tag_zh || '';
            document.getElementById('pf-note-zh').value = d.note_zh || '';
            document.getElementById('pf-description-zh').value = d.description_zh || '';
            document.getElementById('pf-link').value = d.link || '';
            document.getElementById('pf-link-label').value = d.link_label_zh || '';
            document.getElementById('pf-order').value = d.order || 0;
            switchTab('portfolio');
        });
    }
 
    function togglePfType() {
        const isPdf = document.getElementById('pf-type').value === 'pdf';
        document.getElementById('pf-image-field').style.display = isPdf ? 'none' : 'block';
        document.getElementById('pf-pdf-field').style.display = isPdf ? 'block' : 'none';
    }
 
    function resetPfForm() {
        document.getElementById('pf-id').value = '';
        document.getElementById('pf-form-title').textContent = '新增作品';
        document.getElementById('pf-type').value = 'image';
        togglePfType();
        ['pf-title-zh','pf-title-en','pf-tag-zh','pf-note-zh','pf-description-zh','pf-link','pf-link-label','pf-images','pf-pdf'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('pf-order').value = 0;
        document.getElementById('pf-status').textContent = '';
    }
 
    function savePortfolio() {
        const id = document.getElementById('pf-id').value;
        const isPdf = document.getElementById('pf-type').value === 'pdf';
        const titleZh = document.getElementById('pf-title-zh').value.trim();
        if (!titleZh) { document.getElementById('pf-status').textContent = '請至少填寫標題(中)'; return; }
 
        const data = {
            order: Number(document.getElementById('pf-order').value) || 0,
            title_zh: titleZh,
            title_en: document.getElementById('pf-title-en').value.trim(),
            tag_zh: document.getElementById('pf-tag-zh').value.trim(),
            note_zh: document.getElementById('pf-note-zh').value.trim(),
            description_zh: document.getElementById('pf-description-zh').value.trim(),
            link: document.getElementById('pf-link').value.trim(),
            link_label_zh: document.getElementById('pf-link-label').value.trim(),
            images: isPdf ? [] : document.getElementById('pf-images').value.split(',').map(s => s.trim()).filter(Boolean),
            pdf: isPdf ? document.getElementById('pf-pdf').value.trim() : ''
        };
 
        document.getElementById('pf-status').textContent = '儲存中...';
        const ref = id ? db.collection('portfolio').doc(id) : db.collection('portfolio').doc();
        ref.set(data).then(() => {
            document.getElementById('pf-status').textContent = '已儲存！';
            resetPfForm();
            loadList('portfolio');
        }).catch(err => document.getElementById('pf-status').textContent = '失敗：' + err.message);
    }
 
    // ---------- 證照 ----------
    function editCert(id) {
        db.collection('certs').doc(id).get().then(doc => {
            const d = doc.data();
            document.getElementById('cert-id').value = id;
            document.getElementById('cert-form-title').textContent = '編輯證照';
            document.getElementById('cert-title-zh').value = d.title_zh || '';
            document.getElementById('cert-title-en').value = d.title_en || '';
            document.getElementById('cert-images').value = (d.images || (d.image ? [d.image] : [])).join(', ');
            document.getElementById('cert-tag-zh').value = d.tag_zh || '';
            document.getElementById('cert-order').value = d.order || 0;
            switchTab('certs');
        });
    }
 
    function resetCertForm() {
        document.getElementById('cert-id').value = '';
        document.getElementById('cert-form-title').textContent = '新增證照';
        ['cert-title-zh','cert-title-en','cert-tag-zh','cert-images'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('cert-order').value = 0;
        document.getElementById('cert-status').textContent = '';
    }
 
    function saveCert() {
        const id = document.getElementById('cert-id').value;
        const titleZh = document.getElementById('cert-title-zh').value.trim();
        if (!titleZh) { document.getElementById('cert-status').textContent = '請至少填寫標題(中)'; return; }
        const data = {
            order: Number(document.getElementById('cert-order').value) || 0,
            title_zh: titleZh,
            title_en: document.getElementById('cert-title-en').value.trim(),
            tag_zh: document.getElementById('cert-tag-zh').value.trim(),
            images: document.getElementById('cert-images').value.split(',').map(s => s.trim()).filter(Boolean)
        };
        document.getElementById('cert-status').textContent = '儲存中...';
        const ref = id ? db.collection('certs').doc(id) : db.collection('certs').doc();
        ref.set(data).then(() => {
            document.getElementById('cert-status').textContent = '已儲存！';
            resetCertForm();
            loadList('certs');
        }).catch(err => document.getElementById('cert-status').textContent = '失敗：' + err.message);
    }
 
    // ---------- 一次性匯入舊資料 ----------
    function migrateOldData() {
        if (!confirm('確定要匯入舊資料嗎？如果之前已經匯入過，會造成重複。')) return;
        document.getElementById('migrate-status').textContent = '匯入中...';
 
        const experience = [
            { order: 1, date: "2026/01", title_zh: "於高雄四維國小STEAM X 台語沉浸式寒假木工營擔任助教", title_en: "Assistant at Sihwei Primary School STEAM Woodworking Camp" },
            { order: 2, date: "2025", title_zh: "專業設計人才認證 (程式語言C++ 第2版專業級)", title_en: "Professional Design Certification (C++ Level 2)" },
